ont-size="15" fill="#e8b4a0">Docker &amp; containerised deployments</text><circle cx="540" cy="388" r="10" fill="#2a0d15" stroke="#e8b4a0" stroke-width="1.5"/><circle cx="540" cy="388" r="10" fill="none" stroke="#e8b4a0" stroke-width="2"><animate attributeName="r" values="10;20" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2s" repeatCount="indefinite"/></circle><g><path d="M540 382 A6 6 0 0 1 546 388" fill="none" stroke="#e8b4a0" stroke-width="2.2" stroke-linecap="round"/><animateTransform attributeName="transform" type="rotate" from="0 540 388" to="360 540 388" dur="1.6s" repeatCount="indefinite"/></g><text x="566" y="393" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e8b4a0">Advanced React &amp; state management</text><circle cx="540" cy="426" r="9" fill="none" stroke="#6a3442" stroke-width="1.6" stroke-dasharray="3 3"/><text x="566" y="431" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#b69ba2">Cloud deployment (AWS / GCP)</text><circle cx="540" cy="464" r="9" fill="none" stroke="#6a3442" stroke-width="1.6" stroke-dasharray="3 3"/><text x="566" y="469" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#b69ba2">Kubernetes &amp; monitoring</text><g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#b69ba2"><circle cx="60" cy="496" r="6" fill="url(#wine)"/><text x="74" y="501">Done</text><circle cx="140" cy="496" r="6" fill="none" stroke="#e8b4a0" stroke-width="1.6"/><text x="154" y="501">In progress</text><circle cx="262" cy="496" r="6" fill="none" stroke="#6a3442" stroke-dasharray="2 2"/><text x="276" y="501">Planned</text></g>
