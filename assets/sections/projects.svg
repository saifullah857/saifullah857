<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" width="1000" height="100" role="img" aria-label="Featured Projects">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c0710"/><stop offset=".55" stop-color="#2b0a15"/><stop offset="1" stop-color="#12050a"/></linearGradient>
<linearGradient id="wine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8c1c33"/><stop offset="1" stop-color="#c2415e"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c2415e"/><stop offset="1" stop-color="#e8b4a0"/></linearGradient>
<linearGradient id="gn" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#f5e9eb"/><stop offset=".5" stop-color="#e8b4a0"/><stop offset="1" stop-color="#f5e9eb"/><animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="b1"><stop offset="0" stop-color="#8c1c33" stop-opacity=".55"/><stop offset="1" stop-color="#8c1c33" stop-opacity="0"/></radialGradient>
<radialGradient id="b2"><stop offset="0" stop-color="#e8b4a0" stop-opacity=".2"/><stop offset="1" stop-color="#e8b4a0" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e8b4a0" opacity=".12"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="r"><rect width="1000" height="100" rx="16"/></clipPath></defs>
<g clip-path="url(#r)"><rect width="1000" height="100" fill="url(#bg)"/><rect width="1000" height="100" fill="url(#dots)"/>
<circle r="220" fill="url(#b1)"><animate attributeName="cx" values="120;300;120" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="30;90;30" dur="12s" repeatCount="indefinite"/></circle>
<text x="40" y="54" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="url(#gn)">Featured Projects</text>
<text x="42" y="80" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#b69ba2">49 repositories, a selection below</text>
<g transform="translate(900 50)"><rect x="-33" y="-33" width="18" height="18" rx="4" fill="url(#wine)" stroke="#e8b4a0" stroke-opacity=".5"><animate attributeName="opacity" values=".25;1;.25" dur="3s" begin="0.00s" repeatCount="indefinite"/></rect><rect x="-9" y="-33" width="18" height="18" rx="4" fill="url(#wine)" stroke="#e8b4a0" stroke-opacity=".5"><animate attributeName="opacity" values=".25;1;.25" dur="3s" begin="0.25s" repeatCount="indefinite"/></rect><rect x="15" y="-33" width="18" height="18" rx="4" fill="url(#wine)" stroke="#e8b4a0" stroke-opacity=".5"><animate attributeName="opacity" values=".25;1;.25" dur="3s" begin="0.50s" repeatCount="indefinite"/></rect><rect x="-33" y="-9" width="18" height="18" rx="4" fill="url(#wine)" stroke="#e8b4a0" stroke-opacity=".5"><animate attributeName="opacity" values=".25;1;.25" dur="3s" begin="0.75s" repeatCount="indefinite"/></rect><rect x="-9" y="-9" width="18" height="18" rx="4" fill="url(#wine)" stroke="#e8b4a0" stroke-opacity=".5"><animate attributeName="opacity" values=".25;1;.25" dur="3s" begin="1.00s" repeatCount="indefinite"/></rect><rect x="15" y="-9" width="18" height="18" rx="4" fill="url(#wine)" stroke="#e8b4a0" stroke-opacity=".5"><animate attributeName="opacity" values=".25;1;.25" dur="3s" begin="1.25s" repeatCount="indefinite"/></rect><rect x="-33" y="15" width="18" height="18" rx="4" fill="url(#wine)" stroke="#e8b4a0" stroke-opacity=".5"><animate attributeName="opacity" values=".25;1;.25" dur="3s" begin="1.50s" repeatCount="indefinite"/></rect><rect x="-9" y="15" width="18" height="18" rx="4" fill="url(#wine)" stroke="#e8b4a0" stroke-opacity=".5"><animate attributeName="opacity" values=".25;1;.25" dur="3s" begin="1.75s" repeatCount="indefinite"/></rect><rect x="15" y="15" width="18" height="18" rx="4" fill="url(#wine)" stroke="#e8b4a0" stroke-opacity=".5"><animate attributeName="opacity" values=".25;1;.25" dur="3s" begin="2.00s" repeatCount="indefinite"/></rect></g>
<rect y="97" width="1000" height="3" fill="url(#gold)" opacity=".8"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></rect>
</g><rect x=".5" y=".5" width="999" height="99" rx="16" fill="none" stroke="#3a1620"/></svg>