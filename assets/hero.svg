<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Saif Ullah - AI/ML Engineer portfolio hero" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c0710"/><stop offset=".55" stop-color="#2b0a15"/><stop offset="1" stop-color="#12050a"/></linearGradient>
<linearGradient id="wine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8c1c33"/><stop offset="1" stop-color="#c2415e"/></linearGradient>
<linearGradient id="gn" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#f5e9eb"/><stop offset=".5" stop-color="#e8b4a0"/><stop offset="1" stop-color="#f5e9eb"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="b1"><stop offset="0" stop-color="#8c1c33" stop-opacity=".55"/><stop offset="1" stop-color="#8c1c33" stop-opacity="0"/></radialGradient>
<radialGradient id="b2"><stop offset="0" stop-color="#e8b4a0" stop-opacity=".22"/><stop offset="1" stop-color="#e8b4a0" stop-opacity="0"/></radialGradient>
<linearGradient id="fl" x1="0" x2="1"><stop offset="0" stop-color="#12050a"/><stop offset="1" stop-color="#12050a" stop-opacity="0"/></linearGradient>
<linearGradient id="fr" x1="1" x2="0"><stop offset="0" stop-color="#12050a"/><stop offset="1" stop-color="#12050a" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e8b4a0" opacity=".13"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="r"><rect width="1000" height="440" rx="18"/></clipPath>
<clipPath id="tk"><rect x="0" y="394" width="1000" height="36"/></clipPath>
</defs>

<g clip-path="url(#r)">
<rect width="1000" height="440" fill="url(#bg)"/>
<rect y="44" width="1000" height="350" fill="url(#dots)"/>

<!-- drifting light blobs -->
<circle r="260" fill="url(#b1)"><animate attributeName="cx" values="180;300;180" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="140;230;140" dur="14s" repeatCount="indefinite"/></circle>
<circle r="230" fill="url(#b2)"><animate attributeName="cx" values="860;740;860" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="320;190;320" dur="16s" repeatCount="indefinite"/></circle>

<!-- browser chrome -->
<rect width="1000" height="44" fill="#1f0b11"/>
<line x1="0" y1="44" x2="1000" y2="44" stroke="#3a1620"/>
<circle cx="28" cy="22" r="6" fill="#8c1c33"/><circle cx="48" cy="22" r="6" fill="#b4506a"/><circle cx="68" cy="22" r="6" fill="#e8b4a0"/>
<rect x="100" y="10" width="330" height="24" rx="12" fill="#14060a" stroke="#3a1620"/>
<circle cx="118" cy="22" r="4" fill="#4ade80"><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="132" y="27" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#b69ba2">saifullah857.github.io/saif-ullah-portfolio</text>
<g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#b69ba2" text-anchor="end">
<text x="640" y="27">About</text><text x="716" y="27">Skills</text><text x="800" y="27">Projects</text><text x="880" y="27">Roadmap</text></g>
<rect x="898" y="10" width="78" height="24" rx="12" fill="url(#wine)"/>
<text x="937" y="27" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Hire me</text>

<!-- availability pill -->
<rect x="48" y="78" width="176" height="30" rx="15" fill="#2a0d15" stroke="#8c1c33"/>
<circle cx="68" cy="93" r="4" fill="#4ade80"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="68" cy="93" r="3.2" fill="#4ade80"/>
<text x="84" y="98" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#f5e9eb">Open to work · Remote</text>

<!-- name -->
<text x="46" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" fill="url(#gn)" letter-spacing="-1">Saif Ullah</text>
<text x="50" y="228" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#e8b4a0" letter-spacing=".5">AI / ML Engineer  ·  Agent Builder  ·  Full-Stack</text>

<!-- rotating taglines -->
<g font-family="Consolas, Menlo, monospace" font-size="18" fill="#f5e9eb">
<text x="50" y="276" opacity="0">&gt; building multi-agent systems with LangGraph<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.21;.25;1" dur="12s" begin="0s" repeatCount="indefinite"/></text>
<text x="50" y="276" opacity="0">&gt; RAG that is measured, not guessed<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.21;.25;1" dur="12s" begin="3s" repeatCount="indefinite"/></text>
<text x="50" y="276" opacity="0">&gt; shipping LLM apps with Docker + CI/CD<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.21;.25;1" dur="12s" begin="6s" repeatCount="indefinite"/></text>
<text x="50" y="276" opacity="0">&gt; PyTorch, NLP and reinforcement learning<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.21;.25;1" dur="12s" begin="9s" repeatCount="indefinite"/></text>
</g>

<!-- stat chips -->
<g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#f5e9eb" text-anchor="middle">
<rect x="48" y="316" width="140" height="40" rx="12" fill="#2a0d15" stroke="#3a1620"/><text x="118" y="341">49 repositories</text>
<rect x="200" y="316" width="170" height="40" rx="12" fill="#2a0d15" stroke="#3a1620"/><text x="285" y="341">6-agent LangGraph</text>
<rect x="382" y="316" width="150" height="40" rx="12" fill="#2a0d15" stroke="#3a1620"/><text x="457" y="341">9 Agno agents</text>
</g>

<!-- agent graph: edges -->
<g stroke="#8c1c33" stroke-width="1.6" fill="none" opacity=".9">
<path d="M655 120 L800 95"/><path d="M655 120 L650 255"/><path d="M800 95 L790 215"/><path d="M650 255 L790 215"/>
<path d="M790 215 L915 150"/><path d="M790 215 L905 285"/><path d="M905 285 L780 325"/><path d="M800 95 L915 150"/>
</g>
<!-- agent graph: traveling pulses -->
<g fill="#e8b4a0" filter="url(#glow)">
<circle r="3.6"><animateMotion dur="3s" repeatCount="indefinite" path="M655 120 L800 95"/></circle>
<circle r="3.6"><animateMotion dur="3.6s" repeatCount="indefinite" path="M655 120 L650 255"/></circle>
<circle r="3.6"><animateMotion dur="2.8s" begin=".6s" repeatCount="indefinite" path="M800 95 L790 215"/></circle>
<circle r="3.6"><animateMotion dur="3.2s" begin="1s" repeatCount="indefinite" path="M650 255 L790 215"/></circle>
<circle r="3.6"><animateMotion dur="2.6s" begin="1.4s" repeatCount="indefinite" path="M790 215 L915 150"/></circle>
<circle r="3.6"><animateMotion dur="3s" begin="1.8s" repeatCount="indefinite" path="M790 215 L905 285"/></circle>
<circle r="3.6"><animateMotion dur="3.4s" begin="2.2s" repeatCount="indefinite" path="M905 285 L780 325"/></circle>
<circle r="3.6"><animateMotion dur="3.8s" begin=".3s" repeatCount="indefinite" path="M800 95 L915 150"/></circle>
</g>
<!-- agent graph: nodes -->
<g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#f5e9eb" text-anchor="middle">
<rect x="613" y="104" width="84" height="32" rx="16" fill="#2a0d15" stroke="#8c1c33"/><text x="655" y="125">Data</text>
<rect x="758" y="79" width="84" height="32" rx="16" fill="#2a0d15" stroke="#8c1c33"/><text x="800" y="100">RAG</text>
<rect x="608" y="239" width="84" height="32" rx="16" fill="#2a0d15" stroke="#8c1c33"/><text x="650" y="260">Agents</text>
<rect x="873" y="134" width="84" height="32" rx="16" fill="#2a0d15" stroke="#8c1c33"/><text x="915" y="155">Evals</text>
<rect x="860" y="269" width="90" height="32" rx="16" fill="#2a0d15" stroke="#8c1c33"/><text x="905" y="290">Docker</text>
<rect x="735" y="309" width="90" height="32" rx="16" fill="#2a0d15" stroke="#8c1c33"/><text x="780" y="330">CI/CD</text>
<rect x="728" y="196" width="124" height="38" rx="19" fill="url(#wine)" stroke="#e8b4a0" stroke-width="1.5" filter="url(#glow)"><animate attributeName="stroke-opacity" values="1;.4;1" dur="2.4s" repeatCount="indefinite"/></rect>
<text x="790" y="221" font-weight="700" font-size="15">LangGraph</text>
</g>

<!-- scrolling tech ticker -->
<line x1="0" y1="394" x2="1000" y2="394" stroke="#3a1620"/>
<g clip-path="url(#tk)">
<g><animateTransform attributeName="transform" type="translate" from="0 0" to="-1400 0" dur="30s" repeatCount="indefinite"/>
<g font-family="Consolas, Menlo, monospace" font-size="15" fill="#b69ba2">
<text x="0" y="417" textLength="1400" lengthAdjust="spacing">PyTorch  •  LangGraph  •  LangChain  •  Agno  •  RAG  •  LLM Evals  •  Guardrails  •  Docker  •  CI/CD  •  FastAPI  •  React  •  Laravel  •</text>
<text x="1400" y="417" textLength="1400" lengthAdjust="spacing">PyTorch  •  LangGraph  •  LangChain  •  Agno  •  RAG  •  LLM Evals  •  Guardrails  •  Docker  •  CI/CD  •  FastAPI  •  React  •  Laravel  •</text>
</g></g></g>
<rect x="0" y="394" width="80" height="36" fill="url(#fl)"/><rect x="920" y="394" width="80" height="36" fill="url(#fr)"/>
</g>
<rect x=".5" y=".5" width="999" height="439" rx="18" fill="none" stroke="#3a1620"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
